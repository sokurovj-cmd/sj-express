<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SJ Express — Курьерская доставка в Бишкеке</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f4f9; margin: 0; padding: 15px; color: #333; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 400px; margin: auto; }
        h1 { font-size: 22px; text-align: center; color: #111; }
        label { font-size: 14px; font-weight: bold; display: block; margin-top: 12px; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .price-box { background: #eef2ff; padding: 12px; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; color: #4f46e5; margin-top: 15px; }
        button { width: 100%; background: #4f46e5; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        .telegram-btn { background: #0088cc; text-decoration: none; display: block; text-align: center; margin-top: 10px; padding: 12px; border-radius: 8px; color: white; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>SJ Express 🛵</h1>
        <p style="text-align: center; font-size: 13px; color: #666;">Быстрая курьерская доставка по Бишкеку</p>
        
        <label>Адрес отправления:</label>
        <input type="text" id="from" placeholder="Улица, дом (например, Чуй 120)">

        <label>Адрес получения:</label>
        <input type="text" id="to" placeholder="Улица, дом (например, Манаса 40)">

        <label>Примерное расстояние (км):</label>
        <input type="number" id="distance" value="3" min="1" oninput="calculate()">

        <label>Тип доставки:</label>
        <select id="type" onchange="calculate()">
            <option value="normal">Обычная (базовая)</option>
            <option value="express">Срочная (+50 сом)</option>
        </select>

        <label>Ваше имя:</label>
        <input type="text" id="name" placeholder="Как вас зовут?">

        <label>Номер телефона:</label>
        <input type="tel" id="phone" placeholder="+996 XXX XXX XXX">

        <label>Комментарий курьеру:</label>
        <textarea id="comment" placeholder="Квартира, этаж, ориентир"></textarea>

        <div class="price-box" id="priceResult">Итого: 120 сом</div>

        <button onclick="sendOrder()">Заказать курьера</button>
        <a href="https://t.me/SJExpressbot" class="telegram-btn" target="_blank">Открыть Telegram-бота</a>
    </div>

    <script>
        function calculate() {
            let dist = parseFloat(document.getElementById('distance').value) || 0;
            let type = document.getElementById('type').value;
            
            let base = 70 + (dist * 15);
            if (base < 120) base = 120;
            if (type === 'express') base += 50;

            document.getElementById('priceResult').innerText = "Итого: " + base + " сом";
        }

        function sendOrder() {
            let name = document.getElementById('name').value;
            let phone = document.getElementById('phone').value;
            let from = document.getElementById('from').value;
            let to = document.getElementById('to').value;
            let price = document.getElementById('priceResult').innerText;

            if(!name || !phone || !from || !to) {
                alert("Пожалуйста, заполните основные поля!");
                return;
            }

            alert("Спасибо, " + name + "! Заявка принята. " + price + ". В реальном проекте данные отправятся в Telegram.");
        }
        calculate();
    </script>
</body>
</html>
